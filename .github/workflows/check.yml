name: Check desktop foundation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: npm run check
  native-lifecycle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri and WebDriver system packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: cargo install tauri-driver --locked
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      - run: xvfb-run -a npm run test:native
  ui:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, one-worker, reduced-motion, production-build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --project=webkit
        env:
          EMBER_WEBKIT: '1'
          EMBER_WORKERS: ${{ matrix.variant == 'one-worker' && '1' || '' }}
          EMBER_REDUCED_MOTION: ${{ matrix.variant == 'reduced-motion' && '1' || '' }}
          EMBER_SERVER: ${{ matrix.variant == 'production-build' && 'npx vite build --mode preview --outDir dist-preview --base ./ && npx vite preview --mode preview --outDir dist-preview --port 4320 --strictPort' || '' }}
      - name: Keep Playwright traces from failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.variant }}
          path: desktop/test-results
          retention-days: 7
