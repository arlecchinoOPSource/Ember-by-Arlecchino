name: Attach release packages
# When the owner publishes a GitHub release, attach the packages from an approved
# release-candidate run (the exact files that were reviewed), with their checksums.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach packages to
        required: true
      run_id:
        description: Release-candidate run whose artifacts were approved
        required: true
permissions:
  contents: write
  actions: read
env:
  # Ember 1.0.0 candidate approved by the owner on 5 November 2026.
  APPROVED_RUN_ID: ${{ inputs.run_id || '41981196663' }}
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.APPROVED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: packages
          merge-multiple: true
      - name: Verify checksums
        working-directory: packages
        run: |
          ls -la
          sha256sum -c SHA256SUMS-macos.txt
          sed 's/\r$//' SHA256SUMS-windows.txt | sha256sum -c -
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" packages/* --clobber --repo "$GITHUB_REPOSITORY"
