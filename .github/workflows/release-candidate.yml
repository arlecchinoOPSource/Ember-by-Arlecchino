name: Release candidate packages
# Builds installable Ember packages for the owner to review. It never publishes a GitHub
# release; publication waits for the owner's approval (docs/RELEASE-CHECKLIST.md).
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/release-candidate.yml']
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run check
      # Universal (Apple Silicon + Intel), ad-hoc signed as configured; not notarized.
      - run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg
      - name: Collect, verify and checksum
        run: |
          set -euo pipefail
          B=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p ../out
          codesign --verify --deep --strict --verbose=2 "$B/macos/Ember.app"
          lipo -info "$B/macos/Ember.app/Contents/MacOS/"*
          ditto -c -k --keepParent "$B/macos/Ember.app" ../out/Ember_1.0.0_universal.app.zip
          cp "$B"/dmg/*.dmg ../out/
          hdiutil verify ../out/*.dmg
          cd ../out && shasum -a 256 * > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-1.0.0-macOS-universal
          path: out/
          retention-days: 30
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      # Unsigned (no publisher certificate), x64.
      - run: npm run tauri build -- --bundles nsis,msi
      - name: Collect and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe ../out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi ../out/
          Get-ChildItem ../out | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content ../out/SHA256SUMS-windows.txt
          Get-Content ../out/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-1.0.0-Windows-x64
          path: out/
          retention-days: 30
