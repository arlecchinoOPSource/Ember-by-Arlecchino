name: Windows installer verification
on:
  push:
    branches: [codex/issues-6-7]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ember-windows-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm run check
      - run: npm run tauri build -- --bundles nsis,msi
      - name: Install, verify history on restart, uninstall and check retained data
        run: ./e2e/windows-installers.ps1
