<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Ember app icon. Same tile, rim, scanlines and glow as Terminal's icon (assets/terminal-icon.svg
       in Terminal 2.0.0), recoloured to Ember Orange. The italic "e" is IBM Plex Sans Condensed
       SemiBold Italic (SIL OFL 1.1) converted to a path at the same scale and baseline as Terminal's "t";
       the chevron is Terminal's. Source for `npm run tauri icon`; paths only, no fonts. -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
    <radialGradient id="screen" cx="50%" cy="44%" r="62%">
      <stop offset="0" stop-color="#35200F"/>
      <stop offset=".45" stop-color="#1B1009"/>
      <stop offset="1" stop-color="#060403"/>
    </radialGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="3" fill="#FF8A3D" fill-opacity=".07"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".02"/>
      <stop offset=".46" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE2CC"/>
      <stop offset=".35" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#B4521A"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="290" x2="0" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF3E8"/>
      <stop offset=".42" stop-color="#FFB47D"/>
      <stop offset=".62" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#C55B19"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="tight"/>
      <feMerge><feMergeNode in="wide"/><feMergeNode in="tight"/></feMerge>
    </filter>
    <filter id="rimglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <g id="glyph">
      <!-- Italic "e" and Terminal's upright chevron, on the 1024 grid. -->
      <path transform="translate(22 24) scale(1.9) translate(139 382) scale(.345 -.345)" d="M218 -12Q119 -12 74.5 40.5Q30 93 30 188Q30 212 32.5 241.0Q35 270 40 294Q65 411 127.5 472.5Q190 534 290 534Q364 534 409.5 497.5Q455 461 455 392Q455 303 381.5 260.5Q308 218 149 214Q146 202 145.0 189.5Q144 177 144 168Q144 125 162.0 103.5Q180 82 222 82Q263 82 294.5 100.0Q326 118 353 160L424 101Q385 41 334.5 14.5Q284 -12 218 -12ZM276 444Q234 444 209.0 415.5Q184 387 172 329L164 291Q218 294 252.5 300.5Q287 307 307.0 318.5Q327 330 334.5 345.5Q342 361 342 382Q342 444 276 444Z"/>
      <path transform="translate(22 24) scale(1.9)" d="m311 206 57 50-57 50" fill="none" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Tile -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#screen)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#scan)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#vignette)"/>
    <!-- Inner technical frame -->
    <rect x="168" y="168" width="688" height="688" rx="120" fill="none" stroke="#FF8A3D" stroke-opacity=".16" stroke-width="3"/>
  </g>

  <!-- Glyph: glow underneath, then shiny ink -->
  <g fill="#FF8A3D" stroke="#FF8A3D" opacity=".55" filter="url(#glow)"><use href="#glyph"/></g>
  <g fill="url(#ink)" stroke="url(#ink)"><use href="#glyph"/></g>

  <!-- Glass sheen over the upper half -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#sheen)"/>

  <!-- Bold glowing rim, Adobe-style -->
  <rect x="116" y="116" width="792" height="792" rx="168" fill="none" stroke="url(#rim)" stroke-width="32" filter="url(#rimglow)"/>
</svg>
