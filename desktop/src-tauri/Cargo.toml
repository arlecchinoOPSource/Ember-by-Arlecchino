[package]
name = "ember-by-arlecchino"
version = "2.0.2"
description = "Offline desktop habit tracker"
authors = ["Arlecchino"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ember_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2.12.5", features = [] }

[features]
default = ["standalone"]
# The standalone application. Off for a host that embeds Ember (see src/lib.rs).
standalone = []
